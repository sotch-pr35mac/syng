  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  };

    postToHost(&quot;height&quot;, {

          document.body.getBoundingClientRect().height,
        ),

    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

              /** @type {unknown} */

              if (typeof id !== &quot;number&quot;) {

      }
      hostPort = nextHostPort;

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {

    }
    let element = null;
    if (event.target instanceof globalThis.Element) {

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;syng-palette-lab&#x27;);
  const preview = root.querySelector(&#x27;.syng-preview&#x27;);
  const paletteDescriptions = {
    accessible: &#x27;Vivid — saturated blue, orange, pink and green; white labels; current text sizes.&#x27;,
    original: &#x27;Original reference — several text, icon and white-label pairs fall below the contrast targets.&#x27;
  };
  // Owner selected flat styling, vivid passing shades, and some deeper colors.
  // The candidate maximizes chroma within sRGB at the original Oklab hue angle,
  // subject to the specified contrast target. Large text and small text use
  // distinct role colors. No claim of full-app WCAG conformance is made.
  // See syng-palette-aa-data.json for candidate-generation measurements.
  // Oklab reference: https://bottosson.github.io/posts/oklab/
  const palettes = {
    accessible: { name: &#x27;Vivid · AA contrast candidate&#x27;, small: [&#x27;#006bdf&#x27;,&#x27;#a06000&#x27;,&#x27;#da0069&#x27;,&#x27;#008039&#x27;], large: [&#x27;#007cff&#x27;,&#x27;#c87900&#x27;,&#x27;#ff007c&#x27;,&#x27;#00a149&#x27;], fills: [&#x27;#0071eb&#x27;,&#x27;#a96500&#x27;,&#x27;#e5006f&#x27;,&#x27;#00873c&#x27;], accent: &#x27;#007cff&#x27;, muted: &#x27;#707070&#x27;, icons: &#x27;#8c8c8c&#x27;, placeholder: &#x27;#707070&#x27;, onFill: &#x27;#ffffff&#x27; },
    original: { name: &#x27;Original · below contrast targets&#x27;, small: [&#x27;#2880f2&#x27;,&#x27;#e48e1c&#x27;,&#x27;#e43978&#x27;,&#x27;#43b866&#x27;], large: [&#x27;#2880f2&#x27;,&#x27;#e48e1c&#x27;,&#x27;#e43978&#x27;,&#x27;#43b866&#x27;], fills: [&#x27;#76aff9&#x27;,&#x27;#e48e1c&#x27;,&#x27;#e43978&#x27;,&#x27;#43b866&#x27;], accent: &#x27;#76aff9&#x27;, muted: &#x27;#9a9b9c&#x27;, icons: &#x27;#9a9b9c&#x27;, placeholder: &#x27;#cdd1d6&#x27;, onFill: &#x27;#ffffff&#x27; }
  };
  const entries = [
    { characters: [&#x27;中&#x27;,&#x27;国&#x27;], tones: [1,2], pinyin: [&#x27;Zhōng&#x27;,&#x27;guó&#x27;], meaning: &#x27;China&#x27;, definition: &#x27;China; the People’s Republic of China&#x27; },
    { characters: [&#x27;中&#x27;,&#x27;文&#x27;], tones: [1,2], pinyin: [&#x27;Zhōng&#x27;,&#x27;wén&#x27;], meaning: &#x27;Chinese language&#x27;, definition: &#x27;Chinese; the Chinese language&#x27; },
    { characters: [&#x27;你&#x27;,&#x27;好&#x27;], tones: [3,3], pinyin: [&#x27;nǐ&#x27;,&#x27;hǎo&#x27;], meaning: &#x27;Hello; hi&#x27;, definition: &#x27;hello; hi; how are you?&#x27; },
    { characters: [&#x27;学&#x27;,&#x27;习&#x27;], tones: [2,2], pinyin: [&#x27;xué&#x27;,&#x27;xí&#x27;], meaning: &#x27;To study; to learn&#x27;, definition: &#x27;to learn; to study&#x27; },
    { characters: [&#x27;谢&#x27;,&#x27;谢&#x27;], tones: [4,5], pinyin: [&#x27;xiè&#x27;,&#x27;xie&#x27;], meaning: &#x27;Thank you&#x27;, definition: &#x27;to thank; thanks; thank you&#x27; }
  ];
  const toneLabels = [&#x27;1 · mā&#x27;,&#x27;2 · má&#x27;,&#x27;3 · mǎ&#x27;,&#x27;4 · mà&#x27;,&#x27;5 · ma&#x27;];
  const toneCharacters = [&#x27;妈&#x27;,&#x27;麻&#x27;,&#x27;马&#x27;,&#x27;骂&#x27;,&#x27;吗&#x27;];
  const colorNames = [&#x27;Blue / tone 1&#x27;,&#x27;Orange / tone 2&#x27;,&#x27;Pink / tone 3&#x27;,&#x27;Green / tone 4&#x27;];
  const state = { palette: &#x27;accessible&#x27;, entry: 0, feedback: &#x27;&#x27;, smallSize: 16, labelWeight: 500 };
  const largeColorKeys = [&#x27;blue&#x27;,&#x27;orange&#x27;,&#x27;pink&#x27;,&#x27;green&#x27;];
  const feedbackInput = root.querySelector(&#x27;#syng-palette-feedback&#x27;);
  const searchInput = root.querySelector(&#x27;#syng-preview-search&#x27;);
  let activePalette;

  function applySavedState(saved) {
    const model = saved?.modelContent;
    if (model?.revision !== 3 || !palettes[model.palette]) return;
    state.palette = model.palette;
    state.feedback = typeof model.feedback === &#x27;string&#x27; ? model.feedback.slice(0, 3000) : &#x27;&#x27;;
    state.smallSize = Number(model.smallSize) &gt;= 16 &amp;&amp; Number(model.smallSize) &lt;= 20 ? Number(model.smallSize) : 16;
    state.labelWeight = [400, 500, 600, 700].includes(Number(model.labelWeight)) ? Number(model.labelWeight) : 500;
    state.entry = Number.isInteger(saved.privateContent?.entry) &amp;&amp; entries[saved.privateContent.entry] ? saved.privateContent.entry : 0;
    feedbackInput.value = state.feedback;
  }
  function persist() {
    const snapshot = {
      modelContent: { revision: 3, palette: state.palette, paletteName: palettes[state.palette].name, smallSize: state.smallSize, labelWeight: state.labelWeight, feedback: state.feedback },
      privateContent: { entry: state.entry }
    };
    try { window.openai?.setWidgetState?.(snapshot)?.catch(() =&gt; {}); } catch {}
  }
  function toneMarkup(parts, tones, size) {
    return parts.map((part, index) =&gt; `&lt;span class=&quot;tone-${size} tone-${tones[index]}&quot;&gt;${part}&lt;/span&gt;`).join(size === &#x27;large&#x27; &amp;&amp; parts[0].length &gt; 1 ? &#x27; &#x27; : &#x27;&#x27;);
  }
  function renderEntry() {
    const entry = entries[state.entry];
    root.querySelector(&#x27;#syng-entry-characters&#x27;).innerHTML = toneMarkup(entry.characters, entry.tones, &#x27;large&#x27;);
    root.querySelector(&#x27;#syng-entry-pinyin&#x27;).innerHTML = toneMarkup(entry.pinyin, entry.tones, &#x27;large&#x27;);
    root.querySelector(&#x27;#syng-entry-definition&#x27;).textContent = entry.definition;
    root.querySelectorAll(&#x27;.syng-result&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(Number(button.dataset.entry) === state.entry)));
