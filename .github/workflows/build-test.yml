name: Build & Test

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

jobs:
    test:
        name: Test on ${{ matrix.platform }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                    - platform: ubuntu-22.04
                    - platform: windows-latest
        runs-on: ${{ matrix.platform }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: true
            - name: Prepare Node Environment
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - name: Install Dependencies (Linux Only)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 xdg-utils
            - name: Install Frontend Dependencies
              run: npm ci
            - name: Build Frontend
              run: npm run build
            - name: Build Native
              working-directory: src/native
              run: cargo build --locked
            - name: Test Native
              working-directory: src/native
              run: cargo test --locked
            - name: Test Frontend
              run: npm test
