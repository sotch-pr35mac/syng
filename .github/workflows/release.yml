name: Release
on:
    release:
        types: [published]
    workflow_dispatch:
jobs:
    release:
        name: Package ${{ matrix.target }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      target: aarch64-apple-darwin
                      bundles: app,dmg
                    - platform: macos-latest
                      target: x86_64-apple-darwin
                      bundles: app,dmg
                    # Keep both Linux architectures on the same glibc/WebKitGTK baseline.
                    - platform: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                      bundles: deb,rpm,appimage
                    - platform: ubuntu-22.04-arm
                      target: aarch64-unknown-linux-gnu
                      bundles: deb,rpm,appimage
                    - platform: windows-latest
                      target: x86_64-pc-windows-msvc
                      bundles: msi,nsis
                    - platform: windows-latest
                      target: i686-pc-windows-msvc
                      bundles: msi,nsis
                    - platform: windows-11-arm
                      target: aarch64-pc-windows-msvc
                      bundles: nsis
        runs-on: ${{ matrix.platform }}
        defaults:
            run:
                shell: bash
        steps:
            # Node 24-based actions support native Windows ARM64 runners.
            - uses: actions/checkout@v5
              with:
                  submodules: true
            - name: Prepare Node Environment
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
            - name: Install Dependencies (Linux Only)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libssl-dev libwebkit2gtk-4.1-dev build-essential curl wget libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 xdg-utils
            - name: Install Frontend Dependencies
              run: npm ci
            - name: Test Updater Artifact Validation
              run: node --test scripts/check-updater-artifacts.test.ts
            - name: Configure Bridge Artifacts
              run: |
                  node --input-type=module <<'NODE'
                  import { appendFileSync, readFileSync } from 'node:fs';
                  const config = JSON.parse(readFileSync('src/native/tauri.conf.json', 'utf8'));
                  const override = config.version === '2.5.2'
                    ? { bundle: { createUpdaterArtifacts: 'v1Compatible' } }
                    : {};
                  appendFileSync(process.env.GITHUB_ENV, `TAURI_UPDATER_CONFIG=${JSON.stringify(override)}\n`);
                  NODE
            - name: Build Frontend
              run: npm run build
            - name: Select Native Windows ARM64 Toolchain
              if: matrix.target == 'aarch64-pc-windows-msvc'
              run: rustup default stable-aarch64-pc-windows-msvc
            - name: Prepare Tauri Environment
              run: |
                  rustup target add ${{ matrix.target }}
                  cargo install tauri-cli --version 2.12.0 --locked
            - name: Build & Package (macOS Only)
              if: runner.os == 'macOS'
              working-directory: src/native
              env:
                  ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$TAURI_UPDATER_CONFIG" -- --locked
            - name: Build & Package (Linux & Windows)
              if: runner.os != 'macOS'
              working-directory: src/native
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$TAURI_UPDATER_CONFIG" -- --locked
            - name: Validate Packages and Updater Signatures
              run: node scripts/check-updater-artifacts.ts '${{ matrix.target }}' 'src/native/target/${{ matrix.target }}/release/bundle'
            - name: Upload Packages and Updater Signatures
              uses: actions/upload-artifact@v5
              with:
                  name: Packages-${{ matrix.target }}
                  path: src/native/target/${{ matrix.target }}/release/bundle/
                  if-no-files-found: error
